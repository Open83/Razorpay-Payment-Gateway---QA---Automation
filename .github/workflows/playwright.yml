name: Playwright CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci-safe-regression:
    name: CI-safe regression suite (Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # These are NOT real Razorpay credentials - they are fixed, non-secret
    # placeholder strings, safe to keep in plain YAML. Their only purpose is
    # to satisfy the app's "is Razorpay configured at all?" guard
    # (src/routes/payments.js / refunds.js) and to give the webhook HMAC a
    # value to compute against, so the CI-safe suite can exercise its real
    # validation/error-handling logic instead of short-circuiting into a
    # generic "not configured" response. No call made with these ever
    # succeeds against Razorpay's real API, and none of the CI-safe tests
    # require it to. See docs/CI-CD.md for the full test classification.
    #
    # If real Razorpay Test Mode secrets are ever added as repository/
    # environment secrets (RAZORPAY_KEY_ID, RAZORPAY_KEY_SECRET,
    # RAZORPAY_WEBHOOK_SECRET), they must never be wired into this job -
    # they would only matter for the separate, manual `npm run test:razorpay`
    # suite, which this workflow intentionally does not run automatically.
    env:
      NODE_ENV: test
      RAZORPAY_KEY_ID: rzp_test_ci_placeholder_not_real
      RAZORPAY_KEY_SECRET: ci_placeholder_secret_not_real
      RAZORPAY_WEBHOOK_SECRET: ci_placeholder_webhook_secret_not_real

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies (npm ci)
        run: npm ci

      - name: Install Playwright browsers (Chromium only)
        run: npx playwright install --with-deps chromium

      - name: Run CI-safe regression suite
        run: npm run test:ci

      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Upload test traces/screenshots (failures only)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/
          retention-days: 14
